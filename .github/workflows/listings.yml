name: INTEL Listings Scraper

on:
  schedule:
    - cron: '22 9 * * *'   # 4:22 AM CT daily (staggered 5min after Daily Scraper to avoid push race)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: intel-data-push
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run listings scraper
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python scripts/scrape_listings.py

      - name: Commit + push data
        run: |
          git config user.name  "intel-bot"
          git config user.email "intel-bot@oneroofre.net"
          git add data/
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📊 RentCast listings: $(date -u +%Y-%m-%d)"
          # Retry up to 5 times in case another workflow pushed concurrently
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || {
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            }
          done
