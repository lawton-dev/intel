name: INTEL Pre-Foreclosure Scraper

on:
  schedule:
    - cron: '27 9 * * 1'   # Monday 4:27 AM CDT (staggered 10min after Daily Scraper)
    - cron: '27 9 * * 4'   # Thursday 4:27 AM CDT
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: intel-data-push
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run pre-foreclosure scraper
        run: python scripts/scrape_preforeclosure.py
        env:
          BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}

      - name: Commit pre-foreclosure data
        run: |
          git config user.name  "INTEL Bot"
          git config user.email "intel-bot@oneroofre.net"
          git add data/leads-*-preforeclosure.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🤖 INTEL Pre-FC: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry up to 5 times in case another workflow pushed concurrently
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || {
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Pre-Foreclosure Scrape Complete" >> $GITHUB_STEP_SUMMARY
          for f in data/leads-*-preforeclosure.json; do
            python3 -c "
          import json
          d = json.load(open('$f'))
          name = '$f'.replace('data/leads-','').replace('-preforeclosure.json','').upper()
          print(f'{name}: {d[\"totalLeads\"]} leads (of {d.get(\"totalFound\",\"?\")} found)')
          " >> $GITHUB_STEP_SUMMARY
          done
