name: INTEL Daily Scraper

on:
  schedule:
    - cron: '17 9 * * 1-5'   # 4:17 AM CT weekdays (off-hour odd minute for reliability)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: intel-data-push
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pdfminer.six requests beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Run INTEL scraper
        run: python scripts/scrape.py

      - name: Commit updated lead data
        run: |
          git config user.name  "INTEL Bot"
          git config user.email "intel-bot@oneroofre.net"
          git add data/leads*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🤖 INTEL: Daily refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Retry up to 5 times in case another workflow pushed concurrently
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break || {
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            }
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### INTEL Scrape Complete" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          d = json.load(open('data/leads.json'))
          print(f'Total leads: {d[\"totalLeads\"]}')
          for k,v in d['sources'].items():
              print(f'  {k}: {v}')
          print(f'Updated: {d[\"lastUpdated\"]}')
          " >> $GITHUB_STEP_SUMMARY
